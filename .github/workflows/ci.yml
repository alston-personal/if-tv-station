name: IFTV CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check standalone H3 Colab provider
        run: npx tsc --noEmit --skipLibCheck --esModuleInterop --target es2020 --module nodenext --moduleResolution nodenext src/lib/video_provider.ts
      - name: Lint (legacy debt is reported but does not hide build errors)
        continue-on-error: true
        run: npm run lint
      - run: npm run build

  full-source-integration:
    name: Build full Worker with existing H3+Camera graft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/2026-11-06
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check H3 provider on complete source
        run: npx tsc --noEmit --skipLibCheck --esModuleInterop --target es2020 --module nodenext --moduleResolution nodenext src/lib/video_provider.ts
      - name: Assert lip-sync inference is required for H3 outro
        run: |
          grep -Fq "await syncLipMovementStrict(rawVideo, timelineSpeech, syncedVideo, resultDuration)" src/lib/worker.ts
          grep -Fq "adelay=" src/lib/worker.ts
          grep -Fq "Strict lip-sync provider truncated the requested scene" src/lib/lip_sync_util.ts
          grep -Fq "export async function syncLipMovementStrict(" src/lib/lip_sync_util.ts
          grep -Fq "IFTV camera outro requires ONE segment and previewOnly=true" src/lib/worker.ts
      - name: Verify protected six-second outro Job contract
        run: |
          grep -Fq "productionTemplate === 'iftv-leopardcat-outro-v1'" src/app/api/generate/route.ts
          grep -Fq "IFTV_OUTRO_JOB_TOKEN" src/app/api/generate/route.ts
          grep -Fq "IFTV_LEOPARDCAT_MASTER_IMAGE" src/app/api/generate/route.ts
          grep -Fq "job.videoGenerationMode = 'h3_colab'" src/app/api/generate/route.ts
          grep -Fq "job.previewOnly = true" src/app/api/generate/route.ts
          grep -Fq "job.h3DurationSeconds = 6" src/app/api/generate/route.ts
          grep -Fq "let mode = job.videoGenerationMode || process.env.VIDEO_GENERATION_MODE" src/lib/worker.ts
      - name: Build full IFTV application
        run: npm run build
